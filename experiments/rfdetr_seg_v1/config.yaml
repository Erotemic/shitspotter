schema_version: 2
category_names: [poop]

# Detector-truth semantics are deliberately separate from the 68 source
# annotation categories. Poop is the only positive detector class. Known
# named non-poop annotations remain background/distractor evidence, while
# uncertain annotations block negative supervision instead of being silently
# learned as background. Missing/undeclared category identity fails closed.
truth_semantics:
  target_categories: [poop]
  ignore_categories: [ignore, unknown, unkown]
  uncategorized_annotation_policy: ignore
  default_non_target_policy: background
  unclassified_category_policy: ignore

splits:
  train: train_imgs11247_7f54a82d.kwcoco.zip
  validation: vali_imgs1258_9cdcc10a.kwcoco.zip
  test: test_imgs121_80c4a26b.kwcoco.zip

paths:
  data_root: /data/joncrall/dvc-repos/shitspotter_dvc
  output_root: /data/joncrall/dvc-repos/shitspotter_expt_dvc/training/rfdetr_seg_v1
  cache: tile_cache
  # Relative to this config file, so sibling editable checkouts remain usable.
  kdk_repo: ../../../kwcoco_detector_kit

# Geometry policy. Safe negatives are all represented virtually by the
# candidate index; this section does not subsample them.
tiles:
  size: 768
  oversize_factor: 1.0
  source_scales: [1.0, 0.66, 0.40]
  stride_frac: 0.5
  min_keep_fraction: 0.30
  min_gt_area_frac: 0.001
  min_source_scale_long_side: 64
  negative_safety_margin: 32
  jpeg_quality: 92

# Round 0 materializes only this deterministic source/scale-stratified slice
# of the complete virtual negative universe.
round0:
  negative_over_positive: 2.0
  negative_strategy: stratified_by_image
  seed: 783718

# Fixed tiled validation is also bounded. Canonical campaign validation is
# still performed on reconstructed original source images.
validation:
  negative_over_positive: 2.0
  negative_strategy: stratified_by_image
  seed: 783719

mining:
  num_shards: 4
  locality_chunk_size: 256
  batch_size_per_gpu: 8
  max_candidates: 0
  candidate_seed: 783718
  score_thresh: 0.30
  max_hard_per_round: 5000

rfdetr:
  # V3 keeps the conservative v2 optimizer policy and makes one modest
  # hardware-facing change: double the physical batch from 4 to 8/GPU.
  # Keep it isolated so v1/v2 checkpoints and logs remain available.
  run_name: v3
  variant: seg_2xlarge
  input_hw: [768, 768]
  num_gpus: 4
  batch_size_per_gpu: 8
  validation_batch_size_per_gpu: 8
  grad_accum_steps: 1
  epochs: 15
  lr: 0.00005
  backbone_lr: 0.00001
  lr_scheduler: cosine
  lr_scheduler_kwargs:
    min_factor: 0.05
  warmup_epochs: 1.0
  best_model_metric: map
  early_stopping: true
  early_stopping_patience: 4
  early_stopping_min_delta: 0.001
  early_stopping_use_ema: true
  num_workers: 8
  use_amp: true
  image: kwcoco-detector-kit:rfdetr-cu132-aiq

canonical_evaluation:
  window: [768, 768]
  overlap: 0.25
  nms_iou: 0.5
  score_thresholds: [0.01, 0.05, 0.10, 0.20, 0.50]

smoke:
  train_positive_images: 4
  train_negative_images: 4
  validation_positive_images: 2
  validation_negative_images: 2
  seed: 20260918
