schema_version: 1
category_names: [poop]

splits:
  train: train_imgs11247_7f54a82d.kwcoco.zip
  validation: vali_imgs1258_9cdcc10a.kwcoco.zip
  test: test_imgs121_80c4a26b.kwcoco.zip

paths:
  data_root: /data/joncrall/dvc-repos/shitspotter_dvc
  output_root: /data/joncrall/dvc-repos/shitspotter_expt_dvc/training/rfdetr_seg_v1
  cache: tile_cache
  # Relative to this config file, so sibling editable checkouts remain usable.
  kdk_repo: ../../../kwcoco_detector_kit

# Provisional policy: the census and aiq throughput smoke may revise these
# before round 0. Changing rendering settings creates new materialization IDs.
tiles:
  size: 768
  oversize_factor: 1.0
  source_scales: [1.0, 0.66, 0.40]
  stride_frac: 0.5
  min_keep_fraction: 0.30
  min_gt_area_frac: 0.001
  min_source_scale_long_side: 64
  negative_safety_margin: 32
  # Applied before JPEG encoding. These retain enough deterministic negatives
  # for a 3:1 round while avoiding a roughly 400 GB exhaustive negative cache.
  negative_keep_fraction:
    train: 0.17
    validation: 0.18
  jpeg_quality: 92

round0:
  negative_over_positive: 3.0
  seed: 783718

mining:
  num_shards: 4
  locality_chunk_size: 256
  batch_size_per_gpu: 8
  max_candidates: 0
  candidate_seed: 783718
  score_thresh: 0.30
  max_hard_per_round: 5000

rfdetr:
  variant: seg_2xlarge
  input_hw: [768, 768]
  num_gpus: 4
  batch_size_per_gpu: 4
  validation_batch_size_per_gpu: 4
  grad_accum_steps: 1
  epochs: 60
  lr: 0.0001
  backbone_lr: 0.00015
  num_workers: 8
  use_amp: true
  image: kwcoco-detector-kit:rfdetr-cu132-aiq

canonical_evaluation:
  window: [768, 768]
  overlap: 0.25
  nms_iou: 0.5
  score_thresholds: [0.01, 0.05, 0.10, 0.20, 0.50]

smoke:
  train_positive_images: 4
  train_negative_images: 4
  validation_positive_images: 2
  validation_negative_images: 2
  seed: 20260918
